[package]
name = "shion_loader"
version = "0.1.0"
authors = ["OSO Development Team"]
categories = ["embedded", "no-std", "os"]
documentation = "https://docs.rs/shion_loader"
edition = "2024"
keywords = ["bootloader", "uefi", "elf", "kernel", "operating-system"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sugiura-hiromiti/shion"
description = "UEFI-based bootloader for the shion operating system with ELF kernel loading support"

[dependencies]
loader_macro_def = { path = "../macro_def" }
shion_error = { path = "../../deps/error" }
shion_no_std = { path = "../../deps/no_std" }

[features]
default = ["bltonly"]
# Graphics pixel format support
rgb = []
bgr = []
bitmask = []
# Block transfer only mode (default)
bltonly = []

[package.metadata.docs.rs]
# Documentation configuration for docs.rs
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
tabs_in_doc_comments = "allow"
mut_from_ref = "allow"
