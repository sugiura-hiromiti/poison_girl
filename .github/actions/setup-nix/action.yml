name: Setup Nix
description: Install Nix and enable the shared Nix store cache.

inputs:
  github-token:
    description: Token passed to install-nix-action for authenticated GitHub fetches.
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v24
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v13
