name: Multi-Platform Nix Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: multi-platform-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/nix-flake-check.yml
    with:
      runner: ${{ matrix.os }}
      timeout-minutes: 60
