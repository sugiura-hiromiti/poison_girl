name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix flake check
    uses: ./.github/workflows/nix-flake-check.yml
    with:
      runner: ubuntu-latest
      timeout-minutes: 60
