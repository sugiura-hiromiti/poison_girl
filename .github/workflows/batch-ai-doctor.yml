name: Daily AI PR Health Sweep

on:
   schedule:
      # Midnight JST = 15:00 UTC
      - cron: "0 15 * * *"
   workflow_dispatch:

permissions:
   contents: read
   issues: write
   pull-requests: read
   actions: read
   models: read

concurrency:
   group: batch-ai-doctor-${{ github.ref }}
   cancel-in-progress: true

env:
   AI_CI_FAILURE_MODEL: ${{ vars.AI_CI_FAILURE_MODEL || 'openai/gpt-4.1-mini' }}
   AI_DAILY_DIGEST_MODEL: ${{ vars.AI_DAILY_DIGEST_MODEL || 'openai/gpt-4.1-nano' }}
   AI_DAILY_NEWS_MODEL: ${{ vars.AI_DAILY_NEWS_MODEL || 'xai/grok-3' }}
   AI_WEEKLY_LENS_MODEL: ${{ vars.AI_WEEKLY_LENS_MODEL || 'deepseek/deepseek-r1-0528' }}
   AI_WEEKLY_BOTTLENECK_MODEL: ${{ vars.AI_WEEKLY_BOTTLENECK_MODEL || 'xai/grok-3' }}

jobs:
   scan-prs:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      outputs:
         pr_list: ${{ steps.list_prs.outputs.pr_list }}
      steps:
         - name: Compute JST window for yesterday
           id: date
           run: |
              # Compute start of yesterday/today in JST and convert to UTC
              # Uses tzdata to shift from Asia/Tokyo to UTC
              utc_since=$(TZ=Asia/Tokyo date -d 'yesterday 00:00' -u +%Y-%m-%dT%H:%M:%SZ)
              utc_until=$(TZ=Asia/Tokyo date -d 'today 00:00' -u +%Y-%m-%dT%H:%M:%SZ)
              {
                echo "utc_since=$utc_since"
                echo "utc_until=$utc_until"
              } >> "$GITHUB_OUTPUT"

         - name: List yesterday’s PRs (JST window, including reopened)
           id: list_prs
           uses: actions/github-script@v7
           with:
              script: |
                 const since = process.env.UTC_SINCE;
                 const until = process.env.UTC_UNTIL;
                 const prs = await github.paginate(github.rest.pulls.list, {
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   state: "all",
                   per_page: 100
                 });

                 const target = new Set();
                 const inWindow = (d) => d && d >= new Date(since) && d < new Date(until);

                 for (const pr of prs) {
                   const created = new Date(pr.created_at);
                   const closedAt = pr.closed_at ? new Date(pr.closed_at) : null;
                   const mergedAt = pr.merged_at ? new Date(pr.merged_at) : null;
                   if (inWindow(created) || inWindow(closedAt) || inWindow(mergedAt)) {
                     target.add(pr.number);
                     continue;
                   }

                   // Fetch issue events to detect reopen
                   const events = await github.paginate(github.rest.issues.listEvents, {
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     issue_number: pr.number,
                     per_page: 100
                   });

                   const matchedEvent = events.some(e =>
                     (e.event === "reopened" || e.event === "closed") &&
                     inWindow(new Date(e.created_at))
                   );

                   if (matchedEvent) {
                     target.add(pr.number);
                   }
                 }

                 const prList = Array.from(target);
                 core.setOutput('pr_list', JSON.stringify(prList));
                 return prList;
           env:
              UTC_SINCE: ${{ steps.date.outputs.utc_since }}
              UTC_UNTIL: ${{ steps.date.outputs.utc_until }}

   analyze-prs:
      needs: scan-prs
      runs-on: ubuntu-latest
      timeout-minutes: 30
      env:
         GH_TOKEN: ${{ github.token }}
         PR_NUMBER: ${{ matrix.pr }}
      if: ${{ needs.scan-prs.result == 'success' && needs.scan-prs.outputs.pr_list != '[]' }}
      strategy:
         fail-fast: false
         max-parallel: 4
         matrix:
            pr: ${{ fromJSON(needs.scan-prs.outputs.pr_list) }}
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Get PR details
           id: details
           uses: actions/github-script@v7
           with:
              script: |
                 const fs = require('fs');
                 const pr = await github.rest.pulls.get({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   pull_number: Number(process.env.PR_NUMBER)
                 });
                 fs.writeFileSync('pr_details.json', `${JSON.stringify(pr.data, null, 2)}\n`);

         - name: Get last CI status
           id: status
           uses: actions/github-script@v7
           with:
              script: |
                 const fs = require('fs');
                 const pr = JSON.parse(fs.readFileSync('pr_details.json', 'utf8'));
                 const runs = await github.rest.actions.listWorkflowRuns({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   workflow_id: "ci.yml",
                   head_sha: pr.head.sha,
                   per_page: 10
                 });

                 const latest = runs.data.workflow_runs
                   .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

                 if (!latest) {
                   core.setOutput("conclusion", "no-run");
                   core.setOutput("run_id", "");
                   core.setOutput("html_url", "");
                   return "no-run";
                 }

                 const conclusion = latest.conclusion || latest.status || "unknown";
                 core.setOutput("conclusion", conclusion);
                 core.setOutput("run_id", String(latest.id));
                 core.setOutput("html_url", latest.html_url || "");
                 return conclusion;

         - name: Fetch logs
           run: |
              set -euo pipefail
              REPO="$GITHUB_REPOSITORY"
              RUN_ID="${{ steps.status.outputs.run_id }}"
              if [ -n "${RUN_ID:-}" ]; then
                # Try to fetch logs; if unavailable (expired/no-access), write a friendly placeholder.
                if ! gh run view --repo "$REPO" "$RUN_ID" --log > ci_logs.txt 2> gh_err.txt; then
                  echo "Warning: failed to fetch logs for run '$RUN_ID'" >&2 || true
                  if [ -s gh_err.txt ]; then
                    echo "gh error: $(head -n1 gh_err.txt)" >&2 || true
                  fi
                  echo "Logs unavailable for run '$RUN_ID' (may be expired or inaccessible)." > ci_logs.txt || true
                fi
                rm -f gh_err.txt || true
              else
                echo "No CI workflow run found for this PR head SHA." > ci_logs.txt
              fi

         - name: Build AI diagnosis prompt
           if: ${{ steps.status.outputs.conclusion == 'failure' }}
           uses: actions/github-script@v7
           env:
              CI_RUN_URL: ${{ steps.status.outputs.html_url }}
           with:
              script: |
                 const fs = require('fs');
                 const doctor = require('./.github/scripts/ai-doctor');
                 const pr = JSON.parse(fs.readFileSync('pr_details.json', 'utf8'));
                 await doctor.buildFailurePrompt({
                   github,
                   context,
                   pr,
                   ciRunUrl: process.env.CI_RUN_URL,
                   logPath: 'ci_logs.txt',
                   outPath: 'ai_prompt.txt'
                 });

         - name: Check CI failure model availability
           if: ${{ steps.status.outputs.conclusion == 'failure' }}
           id: failure_model
           uses: actions/github-script@v7
           env:
              GITHUB_TOKEN: ${{ github.token }}
              MODEL_ID: ${{ env.AI_CI_FAILURE_MODEL }}
           with:
              script: |
                 const models = require('./.github/scripts/github-models');
                 const result = await models.checkModelAvailability({
                   token: process.env.GITHUB_TOKEN,
                   model: process.env.MODEL_ID
                 });
                 core.setOutput('available', String(result.available));
                 core.setOutput('reason', result.reason);
                 core.setOutput('model', result.model);
                 return result;

         - name: AI diagnosis
           if: ${{ steps.status.outputs.conclusion == 'failure' && steps.failure_model.outputs.available == 'true' }}
           id: ai
           uses: actions/ai-inference@v2
           continue-on-error: true
           with:
              system-prompt: >-
                You are an engineering diagnostician for CI failures. Explain the failure
                semantically: likely cause, confidence, evidence, impact, concrete next
                actions, and small experiment ideas. Return only valid JSON matching the
                schema in the prompt.
              prompt-file: ai_prompt.txt
              model: ${{ env.AI_CI_FAILURE_MODEL }}
              endpoint: https://models.github.ai/inference
              max-completion-tokens: 900
              token: ${{ github.token }}

         - name: Parse AI result
           if: ${{ steps.status.outputs.conclusion == 'failure' }}
           id: parse
           uses: actions/github-script@v7
           env:
              AI_RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
              CI_RUN_URL: ${{ steps.status.outputs.html_url }}
              MODEL_AVAILABLE: ${{ steps.failure_model.outputs.available }}
              MODEL_CHECK_REASON: ${{ steps.failure_model.outputs.reason }}
           with:
              script: |
                 const doctor = require('./.github/scripts/ai-doctor');
                 const diagnosis = doctor.parseDiagnosisResponse({
                   responseFile: process.env.AI_RESPONSE_FILE,
                   ciRunUrl: process.env.CI_RUN_URL,
                   modelGate: {
                     should_call_model: process.env.MODEL_AVAILABLE === 'true',
                     reason: process.env.MODEL_CHECK_REASON || 'model unavailable'
                   }
                 });
                 doctor.writeDiagnosisArtifacts({
                   diagnosis,
                   ciRunUrl: process.env.CI_RUN_URL,
                   timestamp: new Date().toISOString()
                 });
                 core.setOutput('severity', diagnosis.severity);
                 core.setOutput('headline', diagnosis.headline);

         - name: Search existing issue
           if: ${{ steps.status.outputs.conclusion == 'success' || steps.status.outputs.conclusion == 'failure' }}
           id: search
           uses: actions/github-script@v7
           with:
              script: |
                 const fs = require('fs');
                 const prNumber = process.env.PR_NUMBER;
                 const issues = await github.rest.search.issuesAndPullRequests({
                   q: `repo:${context.repo.owner}/${context.repo.repo} in:title "AI Review: PR #${prNumber}"`
                 });
                 const issue = issues.data.items.length ? issues.data.items[0] : null;
                 fs.writeFileSync('existing_issue.json', `${JSON.stringify(issue, null, 2)}\n`);
                 core.setOutput('has_existing_issue', String(Boolean(issue)));

         - name: Close and comment on fix
           if: ${{ steps.status.outputs.conclusion == 'success' && steps.search.outputs.has_existing_issue == 'true' }}
           uses: actions/github-script@v7
           with:
              script: |
                 const fs = require('fs');
                 const issue = JSON.parse(fs.readFileSync('existing_issue.json', 'utf8'));
                 const now = new Date().toISOString();
                 await github.rest.issues.createComment({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   issue_number: issue.number,
                   body: `### [${now}] CI Passed\nAuto-closing issue.`
                 });
                 await github.rest.issues.update({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   issue_number: issue.number,
                   state: "closed"
                 });

         - name: Create or comment on failure
           if: ${{ steps.status.outputs.conclusion == 'failure' && steps.parse.outputs.severity != 'none' }}
           uses: actions/github-script@v7
           with:
              script: |
                 const fs = require('fs');
                 const prNumber = process.env.PR_NUMBER;
                 const issue = JSON.parse(fs.readFileSync('existing_issue.json', 'utf8'));
                 const diagnosis = JSON.parse(fs.readFileSync('ai_diagnosis.json', 'utf8'));
                 const severity = diagnosis.severity;
                 const commentBody = fs.readFileSync('failure_comment.md', 'utf8');
                 const severityLabel = `severity:${severity}`;

                 if (issue) {
                   await github.rest.issues.createComment({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     issue_number: issue.number,
                     body: commentBody
                   });

                   await github.rest.issues.update({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     issue_number: issue.number,
                     state: "open"
                   });

                   const preservedLabels = (issue.labels || [])
                     .map(label => label.name)
                     .filter(label => label && !label.startsWith('severity:'));
                   await github.rest.issues.setLabels({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     issue_number: issue.number,
                     labels: Array.from(new Set([...preservedLabels, "ai-review", "ci-failure", severityLabel]))
                   });
                 } else {
                   const created = await github.rest.issues.create({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     title: `AI Review: PR #${prNumber}`,
                     body: [
                       `Tracking CI health for PR #${prNumber}. Auto-updated daily.`,
                       "",
                       "AI Doctor keeps semantic notes here: likely cause, evidence, next actions, and experiment ideas."
                     ].join("\n"),
                     labels: ["ai-review", "ci-failure", severityLabel]
                   });

                   await github.rest.issues.createComment({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     issue_number: created.data.number,
                     body: commentBody
                   });
                 }

   daily-digest:
     needs: [scan-prs, analyze-prs]
     if: ${{ always() && !cancelled() }}
     runs-on: ubuntu-latest
     timeout-minutes: 20
     env:
        GH_TOKEN: ${{ github.token }}
     steps:
        - name: Compute JST window for yesterday (digest)
          id: date_digest
          run: |
             utc_since=$(TZ=Asia/Tokyo date -d 'yesterday 00:00' -u +%Y-%m-%dT%H:%M:%SZ)
             utc_until=$(TZ=Asia/Tokyo date -d 'today 00:00' -u +%Y-%m-%dT%H:%M:%SZ)
             date_jst=$(TZ=Asia/Tokyo date -d 'yesterday 00:00' +%Y-%m-%d)
             week_jst=$(TZ=Asia/Tokyo date -d 'yesterday 00:00' +%G-W%V)
             {
               echo "utc_since=$utc_since"
               echo "utc_until=$utc_until"
               echo "date_jst=$date_jst"
               echo "week_jst=$week_jst"
             } >> "$GITHUB_OUTPUT"

        - name: Checkout repository
          uses: actions/checkout@v4
          with:
             fetch-depth: 0

        - name: Collect digest context
          id: digest_context
          uses: actions/github-script@v7
          env:
             UTC_SINCE: ${{ steps.date_digest.outputs.utc_since }}
             UTC_UNTIL: ${{ steps.date_digest.outputs.utc_until }}
             DATE_JST: ${{ steps.date_digest.outputs.date_jst }}
             WEEK_JST: ${{ steps.date_digest.outputs.week_jst }}
          with:
            script: |
              const fs = require('fs');
              const doctor = require('./.github/scripts/ai-doctor');
              const digestContext = await doctor.collectDigestContext({
                github,
                context,
                since: process.env.UTC_SINCE,
                until: process.env.UTC_UNTIL,
                dateJst: process.env.DATE_JST
              });
              digestContext.window.week_jst = process.env.WEEK_JST;
              fs.writeFileSync('digest_context.json', `${JSON.stringify(digestContext, null, 2)}\n`);
              core.setOutput('ci_failure_count', String(digestContext.ci_failures.length));
              return { ci_failure_count: digestContext.ci_failures.length };

        - name: Compute git activity (since/until)
          id: git_stats
          run: |
             set -euo pipefail
             SINCE="${{ steps.date_digest.outputs.utc_since }}"
             UNTIL="${{ steps.date_digest.outputs.utc_until }}"
             # Commits count
             commits=$(git log --since="$SINCE" --until="$UNTIL" --pretty=format:'%H' | wc -l | tr -d ' ')
             echo "commits=$commits" >> "$GITHUB_OUTPUT"

             # Top authors (name and count) - top 5
             git log --since="$SINCE" --until="$UNTIL" --pretty=format:'%an' | \
               awk '{a[$0]++} END {for (k in a) printf "%s\t%s\n", a[k], k}' | \
               sort -rn | head -5 > top_authors.txt || true

             # Top-level directories with most changes (top 5)
             git log --since="$SINCE" --until="$UNTIL" --name-only --pretty=format: | \
               grep -v '^$' | awk -F/ '{print $1}' | \
               grep -vE '^(\.|README(\..*)?|LICENSE(\..*)?)$' | \
               awk '{d[$0]++} END {for (k in d) printf "%s\t%s\n", d[k], k}' | \
               sort -rn | head -5 > top_dirs.txt || true

             base_sha=$(git rev-list -n 1 --before="$SINCE" HEAD || true)
             head_sha=$(git rev-list -n 1 --before="$UNTIL" HEAD || git rev-parse HEAD)
             if [ -n "${base_sha:-}" ] && [ -n "${head_sha:-}" ]; then
               git diff --name-only "$base_sha" "$head_sha" > changed_files.txt || true
               git diff --name-status "$base_sha" "$head_sha" > changed_name_status.txt || true
               git diff --numstat "$base_sha" "$head_sha" > changed_numstat.txt || true
               git diff --shortstat "$base_sha" "$head_sha" > diff_shortstat.txt || true
               git diff -U0 "$base_sha" "$head_sha" -- '*.rs' > rust_diff.patch || true
             else
               : > changed_files.txt
               : > changed_name_status.txt
               : > changed_numstat.txt
               : > diff_shortstat.txt
               : > rust_diff.patch
             fi

             if command -v cargo >/dev/null 2>&1 && [ -f Cargo.toml ]; then
               cargo metadata --format-version 1 --no-deps > cargo_metadata.json 2>/tmp/cargo-metadata.err || \
                 printf '{"unavailable":true,"reason":"cargo metadata failed"}\n' > cargo_metadata.json
             else
               printf '{"unavailable":true,"reason":"cargo command or Cargo.toml unavailable"}\n' > cargo_metadata.json
             fi

        - name: Collect general news candidates
          id: news_candidates
          uses: actions/github-script@v7
          env:
             UTC_SINCE: ${{ steps.date_digest.outputs.utc_since }}
             UTC_UNTIL: ${{ steps.date_digest.outputs.utc_until }}
          with:
             script: |
                const news = require('./.github/scripts/ai-news');
                const result = await news.collectNewsCandidates({
                  since: process.env.UTC_SINCE,
                  until: process.env.UTC_UNTIL,
                  outPath: 'news_candidates.json',
                  promptPath: 'news_prompt.txt'
                });
                core.setOutput('candidate_count', String(result.candidates.length));
                return { candidate_count: result.candidates.length, errors: result.errors };

        - name: Check daily news model availability
          if: ${{ steps.news_candidates.outputs.candidate_count != '0' }}
          id: news_model
          uses: actions/github-script@v7
          env:
             GITHUB_TOKEN: ${{ github.token }}
             MODEL_ID: ${{ env.AI_DAILY_NEWS_MODEL }}
          with:
             script: |
                const models = require('./.github/scripts/github-models');
                const result = await models.checkModelAvailability({
                  token: process.env.GITHUB_TOKEN,
                  model: process.env.MODEL_ID
                });
                core.setOutput('available', String(result.available));
                core.setOutput('reason', result.reason);
                core.setOutput('model', result.model);
                return result;

        - name: AI news relevance
          if: ${{ steps.news_candidates.outputs.candidate_count != '0' && steps.news_model.outputs.available == 'true' }}
          id: news_ai
          uses: actions/ai-inference@v2
          continue-on-error: true
          with:
             system-prompt: >-
               You rank supplied news candidates for relevance to a Rust/Nix
               UEFI bootloader/kernel repository. Use only the supplied
               candidates and return only valid JSON matching the schema.
             prompt-file: news_prompt.txt
             model: ${{ env.AI_DAILY_NEWS_MODEL }}
             endpoint: https://models.github.ai/inference
             max-completion-tokens: 800
             token: ${{ github.token }}

        - name: Build weekday lens prompt
          id: lens_prompt
          uses: actions/github-script@v7
          env:
             COMMITS: ${{ steps.git_stats.outputs.commits }}
             NEWS_RESPONSE_FILE: ${{ steps.news_ai.outputs.response-file }}
             NEWS_MODEL_AVAILABLE: ${{ steps.news_model.outputs.available }}
             NEWS_MODEL_REASON: ${{ steps.news_model.outputs.reason }}
             NEWS_CANDIDATE_COUNT: ${{ steps.news_candidates.outputs.candidate_count }}
             AI_WEEKLY_LENS_MODEL: ${{ env.AI_WEEKLY_LENS_MODEL }}
             AI_WEEKLY_BOTTLENECK_MODEL: ${{ env.AI_WEEKLY_BOTTLENECK_MODEL }}
          with:
             script: |
                const fs = require('fs');
                const doctor = require('./.github/scripts/ai-doctor');
                const news = require('./.github/scripts/ai-news');
                const digestContext = JSON.parse(fs.readFileSync('digest_context.json', 'utf8'));
                doctor.attachGitStats(digestContext, {
                  commits: process.env.COMMITS,
                  topAuthorsPath: 'top_authors.txt',
                  topDirsPath: 'top_dirs.txt'
                });
                doctor.attachChangeSignals(digestContext);
                digestContext.news = news.parseNewsRelevanceResponse({
                  responseFile: process.env.NEWS_RESPONSE_FILE,
                  candidateFile: 'news_candidates.json',
                  modelGate: {
                    should_call_model: process.env.NEWS_CANDIDATE_COUNT !== '0' && process.env.NEWS_MODEL_AVAILABLE === 'true',
                    reason: process.env.NEWS_CANDIDATE_COUNT === '0'
                      ? 'no news candidates in digest window'
                      : process.env.NEWS_MODEL_REASON || 'news model unavailable'
                  }
                });
                const lensGate = doctor.createWeeklyLensGate(digestContext, {
                  weeklyLensModel: process.env.AI_WEEKLY_LENS_MODEL,
                  bottleneckModel: process.env.AI_WEEKLY_BOTTLENECK_MODEL
                });
                digestContext.weekly_lens_gate = lensGate;
                fs.writeFileSync('digest_context.json', `${JSON.stringify(digestContext, null, 2)}\n`);
                if (lensGate.should_call_model) {
                  fs.writeFileSync('weekly_lens_prompt.txt', `${doctor.buildWeeklyLensPrompt({
                    context: digestContext,
                    gate: lensGate
                  })}\n`);
                } else {
                  fs.writeFileSync('weekly_lens_prompt.txt', '');
                }
                core.setOutput('should_call_model', String(lensGate.should_call_model));
                core.setOutput('skip_reason', lensGate.reason);
                core.setOutput('model', lensGate.model || '');

        - name: Check weekday lens model availability
          if: ${{ steps.lens_prompt.outputs.should_call_model == 'true' }}
          id: lens_model
          uses: actions/github-script@v7
          env:
             GITHUB_TOKEN: ${{ github.token }}
             MODEL_ID: ${{ steps.lens_prompt.outputs.model }}
          with:
             script: |
                const models = require('./.github/scripts/github-models');
                const result = await models.checkModelAvailability({
                  token: process.env.GITHUB_TOKEN,
                  model: process.env.MODEL_ID
                });
                core.setOutput('available', String(result.available));
                core.setOutput('reason', result.reason);
                core.setOutput('model', result.model);
                return result;

        - name: AI weekday lens
          if: ${{ steps.lens_prompt.outputs.should_call_model == 'true' && steps.lens_model.outputs.available == 'true' }}
          id: lens_ai
          uses: actions/ai-inference@v2
          continue-on-error: true
          with:
             system-prompt: >-
               You produce compact daily lens artifacts for a later weekly
               synthesis model. Preserve evidence, avoid chain-of-thought, and
               return only valid JSON matching the schema.
             prompt-file: weekly_lens_prompt.txt
             model: ${{ steps.lens_prompt.outputs.model }}
             endpoint: https://models.github.ai/inference
             max-completion-tokens: 900
             token: ${{ github.token }}

        - name: Build digest prompt
          id: digest_prompt
          uses: actions/github-script@v7
          env:
             LENS_RESPONSE_FILE: ${{ steps.lens_ai.outputs.response-file }}
             LENS_MODEL_AVAILABLE: ${{ steps.lens_model.outputs.available }}
             LENS_MODEL_REASON: ${{ steps.lens_model.outputs.reason }}
             LENS_PROMPT_SHOULD_CALL_MODEL: ${{ steps.lens_prompt.outputs.should_call_model }}
             LENS_PROMPT_SKIP_REASON: ${{ steps.lens_prompt.outputs.skip_reason }}
          with:
             script: |
                const fs = require('fs');
                const doctor = require('./.github/scripts/ai-doctor');
                const digestContext = JSON.parse(fs.readFileSync('digest_context.json', 'utf8'));
                const lensGate = digestContext.weekly_lens_gate;
                const lensArtifact = doctor.parseWeeklyLensResponse({
                  responseFile: process.env.LENS_RESPONSE_FILE,
                  context: digestContext,
                  gate: lensGate,
                  modelGate: {
                    should_call_model: process.env.LENS_PROMPT_SHOULD_CALL_MODEL === 'true' && process.env.LENS_MODEL_AVAILABLE === 'true',
                    reason: process.env.LENS_MODEL_REASON || process.env.LENS_PROMPT_SKIP_REASON || 'weekday lens model gate skipped inference'
                  }
                });
                if (lensArtifact) {
                  digestContext.weekly_lens = lensArtifact;
                }
                const digestGate = doctor.evaluateDigestModelGate(digestContext);
                digestContext.ai_model_gate = digestGate;
                fs.writeFileSync('digest_context.json', `${JSON.stringify(digestContext, null, 2)}\n`);
                fs.writeFileSync('digest_prompt.txt', `${doctor.buildDigestPrompt(digestContext)}\n`);
                core.setOutput('should_call_model', String(digestGate.should_call_model));
                core.setOutput('skip_reason', digestGate.reason);

        - name: Check daily digest model availability
          if: ${{ steps.digest_prompt.outputs.should_call_model == 'true' }}
          id: digest_model
          uses: actions/github-script@v7
          env:
             GITHUB_TOKEN: ${{ github.token }}
             MODEL_ID: ${{ env.AI_DAILY_DIGEST_MODEL }}
          with:
             script: |
                const fs = require('fs');
                const models = require('./.github/scripts/github-models');
                const result = await models.checkModelAvailability({
                  token: process.env.GITHUB_TOKEN,
                  model: process.env.MODEL_ID
                });
                if (!result.available) {
                  const digestContext = JSON.parse(fs.readFileSync('digest_context.json', 'utf8'));
                  digestContext.ai_model_gate = {
                    should_call_model: false,
                    reason: result.reason
                  };
                  fs.writeFileSync('digest_context.json', `${JSON.stringify(digestContext, null, 2)}\n`);
                }
                core.setOutput('available', String(result.available));
                core.setOutput('reason', result.reason);
                core.setOutput('model', result.model);
                return result;

        - name: AI insight digest
          if: ${{ steps.digest_prompt.outputs.should_call_model == 'true' && steps.digest_model.outputs.available == 'true' }}
          id: digest_ai
          uses: actions/ai-inference@v2
          continue-on-error: true
          with:
             system-prompt: >-
               You are AI Doctor for a Rust/Nix CI system. Turn the supplied
               activity into a semantic daily digest that surfaces patterns,
               hypotheses, risks, next actions, and useful experiment ideas.
               Return only valid JSON matching the schema in the prompt.
             prompt-file: digest_prompt.txt
             model: ${{ env.AI_DAILY_DIGEST_MODEL }}
             endpoint: https://models.github.ai/inference
             max-completion-tokens: 1000
             token: ${{ github.token }}

        - name: Assemble digest markdown
          uses: actions/github-script@v7
          env:
             AI_RESPONSE_FILE: ${{ steps.digest_ai.outputs.response-file }}
             MODEL_ID: ${{ env.AI_DAILY_DIGEST_MODEL }}
             MODEL_AVAILABLE: ${{ steps.digest_model.outputs.available }}
             MODEL_CHECK_REASON: ${{ steps.digest_model.outputs.reason }}
             PROMPT_SHOULD_CALL_MODEL: ${{ steps.digest_prompt.outputs.should_call_model }}
             PROMPT_SKIP_REASON: ${{ steps.digest_prompt.outputs.skip_reason }}
          with:
             script: |
                const fs = require('fs');
                const doctor = require('./.github/scripts/ai-doctor');
                const digestContext = JSON.parse(fs.readFileSync('digest_context.json', 'utf8'));
                const digestInsight = doctor.parseDigestResponse({
                  responseFile: process.env.AI_RESPONSE_FILE,
                  context: digestContext
                });
                const modelLabel = process.env.PROMPT_SHOULD_CALL_MODEL === 'true' && process.env.MODEL_AVAILABLE === 'true'
                  ? process.env.MODEL_ID
                  : `not called (${process.env.MODEL_CHECK_REASON || process.env.PROMPT_SKIP_REASON || 'model gate skipped inference'})`;
                fs.writeFileSync('digest.md', doctor.renderDigestBody({
                  context: digestContext,
                  digestInsight,
                  model: modelLabel
                }));

        - name: Create/Update Daily Digest Issue
          uses: actions/github-script@v7
          env:
             DATE_JST: ${{ steps.date_digest.outputs.date_jst }}
          with:
             script: |
                const fs = require('fs');
                const title = `Daily AI Digest - ${process.env.DATE_JST}`;
                const digestIssues = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${context.repo.owner}/${context.repo.repo} in:title "${title}"`
                });
                const body = fs.readFileSync('digest.md', 'utf8');
                if (digestIssues.data.items.length) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: digestIssues.data.items[0].number,
                    body,
                    labels: ["ai-digest"]
                  });
                } else {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title,
                    body,
                    labels: ["ai-digest"]
                  });
                }
