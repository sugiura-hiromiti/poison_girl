name: Nix Dev Shell Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-shell-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dev shell smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Verify Nix-provided tools
        run: |
          nix develop --command cargo --version
          nix develop --command rustc --version
          nix develop --command qemu-system-aarch64 --version
          nix develop --command readelf --version
